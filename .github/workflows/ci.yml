name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Unit tests against the shipped data (pure functions + audit regressions)
        run: node --test site/test/app.test.mjs site/test/regress.test.mjs site/test/male_data.test.mjs site/test/male_ui.test.mjs site/test/female_v121.test.mjs
      - name: Install file-only male export test dependencies
        run: python3 -m pip install numpy pandas
      - name: Python quick tests (encoder gate, release validator, male exports and copy)
        run: python3 -m unittest tests.test_merge_validation tests.test_validate_release tests.test_male_site_exports tests.test_import_copy tests.test_fly_lines -v
      - name: Validate the production data bundle (Q06)
        run: python3 scripts/validate_release.py
