<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask the Fly · 问问果蝇</title>
  <meta name="description" content="Can't decide what to eat? Let a fruit-fly brain pick. 不知道吃什么？让果蝇脑替你选一个。">
  <link rel="canonical" href="https://askthefly.app/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ask the Fly">
  <meta property="og:title" content="Ask the Fly · 问问果蝇">
  <meta property="og:description" content="Let a published fruit-fly brain model taste your options and pick one. It only judges the first bite. 把几道菜交给一个已发表的果蝇脑模型尝一遍，再让它替你选一个。它只判断第一口。">
  <meta property="og:url" content="https://askthefly.app/">
  <meta property="og:image" content="https://askthefly.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Ask the Fly: three dishes ranked by a fly-brain model's MN9 response">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="zh_CN">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ask the Fly · 问问果蝇">
  <meta name="twitter:description" content="Can't decide what to eat? Let a fruit-fly brain pick. 不知道吃什么？让果蝇脑替你选一个。">
  <meta name="twitter:image" content="https://askthefly.app/og-image.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23b5471f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stub-banner" class="stub-banner" hidden data-i18n="stubBanner"></div>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

  <header class="top">
    <h1 class="title" data-i18n="title"></h1>
    <button id="lang-toggle" class="lang-toggle" type="button" data-i18n-aria="ariaLangToggle"></button>
  </header>

  <main class="app">
    <section class="panel" id="input-panel">
      <p class="lead" data-i18n="lead"></p>
      <form id="option-form" class="option-form" autocomplete="off">
        <div class="input-wrap">
          <input id="option-input" class="option-input" type="text" data-i18n-placeholder="inputPlaceholder" enterkeyhint="done"
                 role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest">
          <div id="suggest" class="suggest" role="listbox" hidden></div>
        </div>
        <button class="btn btn-add" type="submit" data-i18n="add"></button>
      </form>
      <div class="table" id="table">
        <div class="table-head">
          <span class="table-title" data-i18n="tableTitle"></span>
          <canvas id="idle-fly" class="idle-fly" width="56" height="56" aria-hidden="true"></canvas>
        </div>
        <ul id="option-list" class="option-list" aria-live="polite"></ul>
        <p id="table-empty" class="hint" data-i18n="hint"></p>
      </div>
      <div class="actions">
        <button id="ask-btn" class="btn btn-primary" type="button" data-i18n="ask" disabled></button>
        <button id="opposite-btn" class="btn btn-secondary" type="button" data-i18n="opposite" disabled></button>
      </div>
      <section class="library" id="library" aria-labelledby="library-title">
        <div class="library-head">
          <h2 id="library-title" class="library-title" data-i18n="browseTitle"></h2>
          <button id="view-all-btn" class="btn btn-secondary btn-small" type="button" aria-expanded="false" aria-controls="library-panel" data-i18n="viewAll"></button>
        </div>
        <div id="popular-row" class="tile-row" role="group"></div>
        <div id="library-panel" class="library-panel" hidden>
          <input id="library-search" class="option-input" type="search" data-i18n-placeholder="librarySearch" autocomplete="off">
          <div id="library-tabs" class="tabs" role="tablist"></div>
          <div id="library-grid" class="tile-grid" role="group"></div>
          <p id="library-empty" class="hint" hidden data-i18n="libraryEmpty"></p>
        </div>
      </section>
    </section>

    <section class="panel scene-panel" id="scene-panel" hidden>
      <div class="scene-head">
        <span id="scene-status" class="scene-status"></span>
        <label class="speed"><span data-i18n="speed"></span>
          <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
        </label>
        <button id="skip-btn" class="btn btn-secondary btn-small" type="button" data-i18n="skip"></button>
      </div>
      <canvas id="scene-canvas" class="scene-canvas" data-i18n-aria="ariaSceneCanvas"></canvas>
      <div class="brain-wrap">
        <canvas id="brain-canvas" class="brain-canvas" data-i18n-aria="ariaBrainCanvas"></canvas>
        <div id="mn9-pill" class="mn9-counter" hidden><span data-i18n="mn9Label"></span> <strong id="mn9-count">0</strong></div>
      </div>
      <p id="brain-caption" class="brain-caption"></p>
      <div class="legend">
        <span class="chip"><i style="background:#e0774a"></i><span data-i18n="legendSugar"></span></span>
        <span class="chip"><i style="background:#8e6bd6"></i><span data-i18n="legendBitter"></span></span>
        <span class="chip"><i style="background:#4aa3df"></i><span data-i18n="legendWater"></span></span>
        <span class="chip"><i style="background:#3fb3a1"></i><span data-i18n="legendIr94e"></span></span>
        <span class="chip"><i style="background:#ffd84a"></i><span data-i18n="legendMn9"></span></span>
        <span class="chip"><i style="background:#f0e6c8"></i><span data-i18n="legendNamed"></span></span>
        <span class="chip"><i style="background:#c8c0b4"></i><span data-i18n="legendOther"></span></span>
      </div>
      <p class="replay-honesty" data-i18n="replayHonesty"></p>
      <p class="small" data-i18n="anatomySource"></p>
      <p id="layout-note" class="small" hidden data-i18n="layoutPlaceholder"></p>
      <details id="brain-details" class="brain-details">
        <summary data-i18n="brainDetails"></summary>
        <h3 class="sub-h" data-i18n="rasterTitle"></h3>
        <canvas id="raster-canvas" class="raster-canvas" data-i18n-aria="ariaRaster"></canvas>
        <h3 class="sub-h" data-i18n="hudTitle"></h3>
        <p id="hud-idle" class="brain-caption" data-i18n="brainIdle"></p>
        <dl id="hud" class="hud">
          <dt data-i18n="hudTotalNeurons"></dt><dd id="hud-total">–</dd>
          <dt data-i18n="hudActive"></dt><dd id="hud-active">–</dd>
          <dt data-i18n="hudMn9"></dt><dd id="hud-mn9">–</dd>
          <dt data-i18n="hudCell"></dt><dd id="hud-cell" class="mono">–</dd>
          <dt data-i18n="hudLatency"></dt><dd id="hud-latency">–</dd>
          <dt data-i18n="hudInputs"></dt><dd id="hud-inputs">–</dd>
        </dl>
        <h3 class="sub-h" data-i18n="silenceTitle"></h3>
        <div id="silence-controls" class="silence-controls"></div>
        <p id="silence-caption" class="brain-caption"></p>
        <p class="replay-honesty" data-i18n="silenceHonesty"></p>
        <label class="sound"><input type="checkbox" id="sound-toggle"> <span data-i18n="soundToggle"></span></label>
      </details>
    </section>

    <section class="panel" id="result-panel" hidden>
      <div id="verdict" class="verdict"></div>
      <canvas id="result-hero" class="result-hero" data-i18n-aria="ariaResultHero"></canvas>
      <div id="misses" class="misses"></div>
      <div class="actions">
        <button id="again-btn" class="btn btn-primary" type="button" data-i18n="again"></button>
        <button id="share-btn" class="btn btn-secondary" type="button" data-i18n="share"></button>
      </div>
      <details id="details" class="details">
        <summary data-i18n="details"></summary>
      <table class="results" id="results-table">
        <thead>
          <tr>
            <th data-i18n="colOption"></th>
            <th data-i18n="colSugar"></th>
            <th data-i18n="colBitter"></th>
            <th data-i18n="colWater"></th>
            <th data-i18n="colMn9"></th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
      <ul id="card-lines" class="card-lines"></ul>
      </details>
    </section>
  </main>

  <dialog id="card-dialog" class="card-dialog" data-i18n-aria="ariaShareCard">
    <div class="card-dialog-body">
      <canvas id="share-card" class="share-card" width="900" height="1200"></canvas>
      <div class="actions">
        <a id="download-link" class="btn btn-primary" download="ask-the-fly.png" data-i18n="download"></a>
        <button id="close-card-btn" class="btn btn-secondary" type="button" data-i18n="close"></button>
      </div>
    </div>
  </dialog>

  <footer class="foot">
    <p class="honesty" data-i18n="honesty"></p>
    <p class="provenance" data-i18n="provenance"></p>
    <p class="small" id="table-meta"></p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
